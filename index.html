<!doctype html>
<html lang="tr" class="scroll-smooth">
  <head>
     <!-- Alttaki meta tag google search console tagıdır -->
    <meta name="google-site-verification" content="Ssxcg00RAU5blXZiul7lZCkLq18HeCmS30shOPNqNgw" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="shortcut icon" type="image/png" href="/favicon.png" />
    <link rel="apple-touch-icon" href="/favicon.png" />

    <!-- Primary Meta Tags -->
    <title>akademITU</title>
    <meta name="title" content="{{site.title}}" />
    <meta name="description" content="{{site.description}}" />
    <meta name="keywords" content="{{site.keywords}}" />
    <meta name="author" content="{{site.name}}" />
    <meta name="language" content="Turkish" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <link rel="canonical" href="{{site.domain}}/" />
    
    <!-- Open Graph Meta Tags -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{site.domain}}/" />
    <meta property="og:title" content="{{site.title}}" />
    <meta property="og:description" content="{{site.description}}" />
    <meta property="og:image" content="{{site.domain}}{{site.logoUrl}}" />
    <meta property="og:locale" content="tr_TR" />
    
    <!-- Twitter Meta Tags -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="{{site.domain}}/" />
    <meta property="twitter:title" content="{{site.title}}" />
    <meta property="twitter:description" content="{{site.description}}" />
    <meta property="twitter:image" content="{{site.domain}}{{site.logoUrl}}" />
    
    <!-- Additional SEO Tags -->
    <meta name="theme-color" content="#191F61" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    
    <link rel="icon" type="image/png" href="/logo.png?v=2" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Geologica:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Sitemap & RSS -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />
  </head>
  <body class="font-sans antialiased text-slate-800 bg-slate-50 selection:bg-[#B6D6CC] selection:text-[#191F61]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
